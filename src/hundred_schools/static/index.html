<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>诸子百家智囊团</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* ---- GitHub-inspired light theme ---- */
  :root {
    --bg:        #ffffff;
    --canvas:    #f6f8fa;
    --surface:   #ffffff;
    --border:    #d0d7de;
    --text:      #1f2328;
    --text-dim:  #656d76;
    --accent:    #0969da;
    --user-msg:  #ddf4ff;
    --assistant-msg: #f6f8fa;
    --btn:       #2da44e;
    --btn-hover: #2c974b;
    --loading:   #d0d7de;

    --school-confucian: #bf6f36;
    --school-legalist:  #cf222e;
    --school-taoist:    #1a7f37;
    --school-strategist:#8250df;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---- Header ---- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: var(--canvas);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; font-weight: 600; }

  #new-session-btn {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 5px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: background-color 0.15s;
  }
  #new-session-btn:hover { background: var(--canvas); }

  /* ---- Error banner ---- */
  .error-banner {
    background: #ffebe9;
    color: #cf222e;
    text-align: center;
    padding: 8px;
    font-size: 13px;
    display: none;
    border-bottom: 1px solid #ff818266;
  }
  .error-banner.visible { display: block; }

  /* ---- Four-school grid ---- */
  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    overflow: hidden;
  }

  .school-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .school-panel:nth-child(2n) { border-right: none; }
  .school-panel:nth-last-child(-n+2) { border-bottom: none; }

  .school-header {
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 600;
    background: var(--canvas);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .school-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .msg {
    max-width: 92%;
    padding: 8px 12px;
    border-radius: 10px;
    line-height: 1.6;
    font-size: 13px;
    word-wrap: break-word;
    white-space: pre-wrap;
    border: 1px solid transparent;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-msg);
    border-color: #b6d4f0;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--assistant-msg);
    border-color: var(--border);
  }
  .msg.system {
    align-self: center;
    background: transparent;
    color: var(--text-dim);
    font-size: 12px;
    max-width: 100%;
    text-align: center;
    padding: 4px 0;
  }

  .empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 14px;
    text-align: center;
    padding: 20px;
    line-height: 1.8;
  }

  /* ---- Typing indicator ---- */
  .typing {
    display: inline-flex;
    gap: 4px;
    padding: 8px 12px;
    align-self: flex-start;
    background: var(--assistant-msg);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .typing span {
    width: 7px; height: 7px;
    background: var(--loading);
    border-radius: 50%;
    animation: bounce 1.3s infinite ease-in-out;
  }
  .typing span:nth-child(1) { animation-delay: -0.32s; }
  .typing span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }

  /* ---- Input area ---- */
  .input-area {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: var(--canvas);
    border-top: 1px solid var(--border);
  }
  .input-area textarea {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 14px;
    font-size: 14px;
    resize: none;
    max-height: 120px;
    font-family: inherit;
    line-height: 1.5;
  }
  .input-area textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px #0969da33;
  }
  .input-area textarea::placeholder { color: var(--text-dim); }

  .send-btn {
    background: var(--btn);
    color: #fff;
    border: none;
    padding: 0 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: background-color 0.15s;
    white-space: nowrap;
  }
  .send-btn:hover { background: var(--btn-hover); }
  .send-btn:disabled { background: var(--loading); cursor: not-allowed; }

  /* ---- Responsive ---- */
  @media (max-width: 700px) {
    .grid { grid-template-columns: 1fr; }
    .school-panel { border-right: none !important; }
  }
</style>
</head>
<body>

<div id="error-banner" class="error-banner"></div>

<header>
  <h1>诸子百家智囊团</h1>
  <button id="new-session-btn">新对话</button>
</header>

<div class="grid" id="grid"></div>

<div class="input-area">
  <textarea id="user-input" rows="1" placeholder="输入你的问题…" disabled></textarea>
  <button class="send-btn" id="send-btn" disabled>发送</button>
</div>

<script>
const API = '';
let sessionId = null;
let schools = [];
let sending = false;
let messageCount = 0;          // counts user sends since last compress

const SCHOOL_COLORS = {
  confucian: 'var(--school-confucian)',
  legalist:  'var(--school-legalist)',
  taoist:    'var(--school-taoist)',
  strategist:'var(--school-strategist)',
};

// ---- DOM refs ----
const gridEl      = document.getElementById('grid');
const userInput   = document.getElementById('user-input');
const sendBtn     = document.getElementById('send-btn');
const errorBanner = document.getElementById('error-banner');
const newSessionBtn = document.getElementById('new-session-btn');

// ---- Error handling ----
function showError(msg) {
  errorBanner.textContent = msg;
  errorBanner.classList.add('visible');
  setTimeout(() => errorBanner.classList.remove('visible'), 5000);
}

// ---- API ----
async function createSession() {
  const res = await fetch(`${API}/sessions`, { method: 'POST' });
  if (!res.ok) throw new Error(`创建会话失败: ${res.status}`);
  return res.json();
}

async function broadcastMessage(message) {
  const res = await fetch(`${API}/sessions/${sessionId}/broadcast`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message }),
  });
  if (!res.ok) throw new Error(`请求失败: ${res.status}`);
  return res.json();
}

async function compressSession() {
  const res = await fetch(`${API}/sessions/${sessionId}/compress`, { method: 'POST' });
  if (!res.ok) throw new Error(`压缩失败: ${res.status}`);
  return res.json();
}

// ---- Render ----
function renderGrid() {
  gridEl.innerHTML = '';
  for (const s of schools) {
    const panel = document.createElement('div');
    panel.className = 'school-panel';
    panel.id = `panel-${s.id}`;

    const header = document.createElement('div');
    header.className = 'school-header';

    const dot = document.createElement('span');
    dot.className = 'school-dot';
    dot.style.background = SCHOOL_COLORS[s.id] || 'var(--accent)';

    header.appendChild(dot);
    header.appendChild(document.createTextNode(s.name));

    const messagesEl = document.createElement('div');
    messagesEl.className = 'messages';
    messagesEl.id = `messages-${s.id}`;

    const emptyEl = document.createElement('div');
    emptyEl.className = 'empty-state';
    emptyEl.id = `empty-${s.id}`;
    emptyEl.innerHTML = `等待提问…`;

    panel.appendChild(header);
    panel.appendChild(emptyEl);
    panel.appendChild(messagesEl);
    gridEl.appendChild(panel);
  }
}

function addMessage(schoolId, role, content) {
  const messagesEl = document.getElementById(`messages-${schoolId}`);
  const emptyEl = document.getElementById(`empty-${schoolId}`);
  if (!messagesEl || !emptyEl) return;

  if (emptyEl.style.display !== 'none') emptyEl.style.display = 'none';

  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = content;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping(schoolId) {
  const messagesEl = document.getElementById(`messages-${schoolId}`);
  const emptyEl = document.getElementById(`empty-${schoolId}`);
  if (!messagesEl || !emptyEl) return;
  if (emptyEl.style.display !== 'none') emptyEl.style.display = 'none';

  const div = document.createElement('div');
  div.className = 'typing';
  div.id = `typing-${schoolId}`;
  div.innerHTML = '<span></span><span></span><span></span>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function hideTyping(schoolId) {
  const el = document.getElementById(`typing-${schoolId}`);
  if (el) el.remove();
}

function setInputEnabled(enabled) {
  userInput.disabled = !enabled;
  sendBtn.disabled = !enabled || sending;
  if (enabled && !sending) userInput.focus();
}

// ---- Send to all four schools ----
async function handleSend() {
  const text = userInput.value.trim();
  if (!text || sending) return;

  sending = true;
  setInputEnabled(false);
  userInput.value = '';
  userInput.style.height = 'auto';

  // Show user message in all panels
  for (const s of schools) {
    addMessage(s.id, 'user', text);
    showTyping(s.id);
  }

  try {
    const data = await broadcastMessage(text);
    messageCount++;

    // Hide typing and show responses
    for (const s of schools) {
      hideTyping(s.id);
      const reply = data.responses[s.id];
      if (reply && reply.content) {
        addMessage(s.id, 'assistant', reply.content);
      } else {
        addMessage(s.id, 'system', '未收到回复');
      }
    }

    // Compress history every 10 rounds
    if (messageCount >= 10) {
      try {
        await compressSession();
        messageCount = 0;
      } catch (e) {
        console.warn('压缩失败:', e);
      }
    }
  } catch (err) {
    for (const s of schools) {
      hideTyping(s.id);
      addMessage(s.id, 'system', `请求失败：${err.message}`);
    }
    showError(err.message);
  } finally {
    sending = false;
    setInputEnabled(true);
  }
}

// ---- Init ----
newSessionBtn.addEventListener('click', async () => {
  try {
    const data = await createSession();
    sessionId = data.session_id;
    schools = data.schools;
    messageCount = 0;
    renderGrid();
    setInputEnabled(true);
  } catch (err) {
    showError(err.message);
  }
});

sendBtn.addEventListener('click', handleSend);
userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
});

// Auto-start a session on load
(async () => {
  try {
    const data = await createSession();
    sessionId = data.session_id;
    schools = data.schools;
    messageCount = 0;
    renderGrid();
    setInputEnabled(true);
  } catch (err) {
    showError(`无法创建会话：${err.message}`);
  }
})();
</script>
</body>
</html>
