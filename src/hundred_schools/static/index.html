<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>诸子百家智囊团</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface-hover: #1c2a4a;
    --border: #2a3a5c;
    --text: #e0e0e0;
    --text-dim: #8892a4;
    --accent: #e2b714;
    --user-msg: #1e3a5f;
    --assistant-msg: #1c2844;
    --tab-confucian: #d4a574;
    --tab-legalist: #c0392b;
    --tab-taoist: #27ae60;
    --tab-strategist: #8e44ad;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* --- Header --- */
  header {
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  #new-session-btn {
    background: var(--accent);
    color: #1a1a2e;
    border: none;
    padding: 6px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }
  #new-session-btn:hover { opacity: 0.85; }

  /* --- Tabs --- */
  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    flex: 1;
    padding: 12px 0;
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    color: var(--text-dim);
    font-size: 15px;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--text); font-weight: 600; }
  .tab-btn[data-school="confucian"].active { border-bottom-color: var(--tab-confucian); }
  .tab-btn[data-school="legalist"].active { border-bottom-color: var(--tab-legalist); }
  .tab-btn[data-school="taoist"].active { border-bottom-color: var(--tab-taoist); }
  .tab-btn[data-school="strategist"].active { border-bottom-color: var(--tab-strategist); }

  /* --- Chat panels --- */
  .chat-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .chat-panel {
    display: none;
    flex: 1;
    flex-direction: column;
    overflow: hidden;
  }
  .chat-panel.active { display: flex; }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.6;
    font-size: 14px;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-msg);
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--assistant-msg);
    border-bottom-left-radius: 4px;
  }
  .msg.system {
    align-self: center;
    background: transparent;
    color: var(--text-dim);
    font-size: 12px;
    max-width: 100%;
    text-align: center;
    padding: 4px 0;
  }

  .empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 15px;
    text-align: center;
    padding: 20px;
    line-height: 1.8;
  }

  /* --- Input area --- */
  .input-area {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  .input-area textarea {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 14px;
    font-size: 14px;
    resize: none;
    max-height: 120px;
    font-family: inherit;
    line-height: 1.5;
  }
  .input-area textarea:focus { outline: 1px solid var(--accent); }
  .send-btn {
    background: var(--accent);
    color: #1a1a2e;
    border: none;
    padding: 0 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: opacity 0.2s;
  }
  .send-btn:hover { opacity: 0.85; }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* --- Loading spinner --- */
  .typing {
    display: inline-flex;
    gap: 4px;
    padding: 10px 14px;
    align-self: flex-start;
    background: var(--assistant-msg);
    border-radius: 12px;
    border-bottom-left-radius: 4px;
  }
  .typing span {
    width: 8px; height: 8px;
    background: var(--text-dim);
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out;
  }
  .typing span:nth-child(1) { animation-delay: -0.32s; }
  .typing span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }

  /* --- Error banner --- */
  .error-banner {
    background: #3d1f1f;
    color: #e74c3c;
    text-align: center;
    padding: 8px;
    font-size: 13px;
    display: none;
  }
  .error-banner.visible { display: block; }
</style>
</head>
<body>

<div id="error-banner" class="error-banner"></div>

<header>
  <h1>诸子百家智囊团</h1>
  <button id="new-session-btn">新对话</button>
</header>

<div class="tabs" id="tabs"></div>

<div class="chat-container" id="chat-container"></div>

<div class="input-area">
  <textarea id="user-input" rows="1" placeholder="输入你的问题…" disabled></textarea>
  <button class="send-btn" id="send-btn" disabled>发送</button>
</div>

<script>
const API = '';
let sessionId = null;
let activeSchool = null;
let schools = [];
let sending = false;

// ---- DOM refs ----
const tabsEl = document.getElementById('tabs');
const chatContainer = document.getElementById('chat-container');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const errorBanner = document.getElementById('error-banner');
const newSessionBtn = document.getElementById('new-session-btn');

// ---- Error handling ----
function showError(msg) {
  errorBanner.textContent = msg;
  errorBanner.classList.add('visible');
  setTimeout(() => errorBanner.classList.remove('visible'), 5000);
}

// ---- API ----
async function createSession() {
  const res = await fetch(`${API}/sessions`, { method: 'POST' });
  if (!res.ok) throw new Error(`创建会话失败: ${res.status}`);
  return res.json();
}

async function sendMessage(schoolId, message) {
  const res = await fetch(`${API}/sessions/${sessionId}/chat/${schoolId}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message }),
  });
  if (!res.ok) throw new Error(`请求失败: ${res.status}`);
  return res.json();
}

// ---- Render ----
function renderTabs() {
  tabsEl.innerHTML = '';
  for (const s of schools) {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (s.id === activeSchool ? ' active' : '');
    btn.dataset.school = s.id;
    btn.textContent = s.name;
    btn.addEventListener('click', () => switchSchool(s.id));
    tabsEl.appendChild(btn);
  }
}

function renderChatPanels() {
  chatContainer.innerHTML = '';
  for (const s of schools) {
    const panel = document.createElement('div');
    panel.className = 'chat-panel' + (s.id === activeSchool ? ' active' : '');
    panel.id = `panel-${s.id}`;

    const messagesEl = document.createElement('div');
    messagesEl.className = 'messages';
    messagesEl.id = `messages-${s.id}`;

    const emptyEl = document.createElement('div');
    emptyEl.className = 'empty-state';
    emptyEl.id = `empty-${s.id}`;
    emptyEl.innerHTML = `向<span style="color:var(--tab-${s.id})">${s.name}</span>智囊提问<br>开始你的专属对话`;

    panel.appendChild(emptyEl);
    panel.appendChild(messagesEl);
    chatContainer.appendChild(panel);
  }
}

function addMessage(schoolId, role, content) {
  const messagesEl = document.getElementById(`messages-${schoolId}`);
  const emptyEl = document.getElementById(`empty-${schoolId}`);
  if (!messagesEl || !emptyEl) return;

  if (emptyEl.style.display !== 'none') emptyEl.style.display = 'none';

  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = content;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping(schoolId) {
  const messagesEl = document.getElementById(`messages-${schoolId}`);
  const emptyEl = document.getElementById(`empty-${schoolId}`);
  if (!messagesEl || !emptyEl) return;

  if (emptyEl.style.display !== 'none') emptyEl.style.display = 'none';

  const div = document.createElement('div');
  div.className = 'typing';
  div.id = `typing-${schoolId}`;
  div.innerHTML = '<span></span><span></span><span></span>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function hideTyping(schoolId) {
  const el = document.getElementById(`typing-${schoolId}`);
  if (el) el.remove();
}

function setInputEnabled(enabled) {
  userInput.disabled = !enabled;
  sendBtn.disabled = !enabled || sending;
  if (enabled && !sending) userInput.focus();
}

function switchSchool(schoolId) {
  activeSchool = schoolId;
  renderTabs();
  document.querySelectorAll('.chat-panel').forEach(p => p.classList.remove('active'));
  const panel = document.getElementById(`panel-${schoolId}`);
  if (panel) panel.classList.add('active');
  setInputEnabled(!sending);
}

async function handleSend() {
  const text = userInput.value.trim();
  if (!text || sending || !activeSchool) return;

  sending = true;
  setInputEnabled(false);
  userInput.value = '';
  userInput.style.height = 'auto';
  addMessage(activeSchool, 'user', text);
  showTyping(activeSchool);

  try {
    const data = await sendMessage(activeSchool, text);
    hideTyping(activeSchool);
    addMessage(activeSchool, 'assistant', data.assistant.content);
  } catch (err) {
    hideTyping(activeSchool);
    addMessage(activeSchool, 'system', `请求失败：${err.message}`);
    showError(err.message);
  } finally {
    sending = false;
    setInputEnabled(true);
  }
}

// ---- Init ----
newSessionBtn.addEventListener('click', async () => {
  try {
    const data = await createSession();
    sessionId = data.session_id;
    schools = data.schools;
    activeSchool = schools[0]?.id;
    renderTabs();
    renderChatPanels();
    setInputEnabled(true);
  } catch (err) {
    showError(err.message);
  }
});

sendBtn.addEventListener('click', handleSend);
userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

// Auto-resize textarea
userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
});

// Auto-start a session on load
(async () => {
  try {
    const data = await createSession();
    sessionId = data.session_id;
    schools = data.schools;
    activeSchool = schools[0]?.id;
    renderTabs();
    renderChatPanels();
    setInputEnabled(true);
  } catch (err) {
    showError(`无法创建会话：${err.message}`);
  }
})();
</script>
</body>
</html>
