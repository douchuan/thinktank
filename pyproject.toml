[project]
name = "hundred-schools-council"
version = "0.1.0"
description = "A CrewAI-powered council of the Hundred Schools of Thought."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "crewai>=0.100.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.0",
  "langfuse>=2.50.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.9.0",
  "mypy>=1.13.0",
]

[project.scripts]
hundred-schools = "hundred_schools.main:main"
hundred-schools-web = "hundred_schools.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hundred_schools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
